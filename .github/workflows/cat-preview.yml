name: Walking cat preview
on:
  pull_request:
    paths: ['cat/**', '.github/workflows/cat-preview.yml']
  push:
    branches: [main]
    paths: ['cat/**', '.github/workflows/cat-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: walking-cat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rive CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgles2 libx11-6 libgl1-mesa-dri fonts-noto-cjk
          curl -fsSL https://releases.rive.app/cli/install.sh -o /tmp/install-rive.sh
          bash /tmp/install-rive.sh
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Generate and validate cat
        run: |
          set -euo pipefail
          mkdir -p build/cat
          rive --version | tee build/cat/cli-version.txt
          rive docs --list > build/cat/docs-topics.txt
          for type in Node CubicDetachedVertex PointsPath LinearAnimation KeyFrameDouble; do
            rive schema "$type" --json > "build/cat/schema-$type.json"
          done
          python3 cat/build.py
          rive cat --verify --format=json | tee build/cat/verify.json
          rive inspect cat --summary | tee build/cat/inspect.json
          python3 -m unittest discover -s cat/tests -v
          rive cat --once
          cp cat/build/walking-cat.riv cat/web/walking-cat.riv
          cp cat/build/walking-cat.riv cat/scene.rml build/cat/
      - name: Check actual browser rendering and controls
        run: |
          set -euo pipefail
          mkdir -p /tmp/cat-runtime
          npm pack @rive-app/canvas@2.42.1 --pack-destination /tmp/cat-runtime
          tar -xzf /tmp/cat-runtime/rive-app-canvas-2.42.1.tgz -C /tmp/cat-runtime
          python3 -m pip install playwright==1.57.0 Pillow==11.3.0
          if ! command -v google-chrome && ! command -v chromium; then
            python3 -m playwright install --with-deps chromium
          fi
          python3 cat/tests/browser_check.py --runtime /tmp/cat-runtime/package --output build/cat/browser
      - name: Commit explicitly requested generated cat assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[rebuild-cat]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- cat/scene.rml cat/web/walking-cat.riv
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: regenerate verified walking cat assets'
            gh auth setup-git
            git push origin HEAD:main
          fi
      - name: Check generated files stay synchronized
        run: git diff --exit-code -- cat/scene.rml cat/web/walking-cat.riv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walking-cat-preview
          path: build/cat/
          retention-days: 14
