name: Walking cat preview
on:
  pull_request:
    paths: ['cat/**', '.github/workflows/cat-preview.yml']
  push:
    branches: [main]
    paths: ['cat/**', '.github/workflows/cat-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rive CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgles2 libx11-6 libgl1-mesa-dri xvfb
          curl -fsSL https://releases.rive.app/cli/install.sh -o /tmp/install-rive.sh
          bash /tmp/install-rive.sh
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Generate and validate cat
        run: |
          mkdir -p build/cat
          rive --version | tee build/cat/cli-version.txt
          python3 cat/build.py
          rive cat --verify --format=json | tee build/cat/verify.json
          rive inspect cat --summary | tee build/cat/inspect.json
          if test -d cat/tests; then python3 -m unittest discover -s cat/tests -v; fi
          rive cat --once
          cp cat/build/walking-cat.riv build/cat/
          cp cat/scene.rml build/cat/
      - name: Prepare pinned browser runtime for preview verification
        run: |
          npm pack @rive-app/canvas@2.42.1 --pack-destination build/cat
          cp -L /usr/lib/x86_64-linux-gnu/libGLESv2.so.2 build/cat/libGLESv2.so.2
          tar --exclude=./.git --exclude=./build --exclude=./cat/build -czf build/cat/repository.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walking-cat-preview
          path: build/cat/
          retention-days: 7
