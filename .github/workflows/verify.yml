name: Rive checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgles2 libx11-6 libgl1-mesa-dri xvfb
      - name: Install Rive CLI
        run: |
          curl --fail --silent --show-error --location https://releases.rive.app/cli/install.sh -o /tmp/install-rive.sh
          bash /tmp/install-rive.sh
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Collect compiler diagnostics
        run: |
          mkdir -p build
          cp scene.rml build/scene.rml
          tar --exclude=.git --exclude=build -czf build/source.tar.gz .
          cp -L "$HOME/.rive/bin/rive" build/rive-linux-x64
          rive --version
          rive schema Node --bindable | tee build/node-schema.txt
          rive docs --list | tee build/docs-topics.txt
      - name: Reproduce generated scene
        run: |
          python3 authoring/build_character.py
          git diff --exit-code -- scene.rml authoring/neck_data.txt
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
        if: ${{ hashFiles('tests/test_*.py') != '' }}
      - name: Compile and inspect
        run: |
          rive . --verify --format=json | tee build/verify.json
          rive inspect . --summary | tee build/inspect.txt
      - name: Capture rest pose
        run: xvfb-run -a rive . --screenshot=build/rest.png --advance=1
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rive-checks
          path: build/
          if-no-files-found: ignore
