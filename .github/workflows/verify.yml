name: Rive checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgles2 libx11-6 libgl1-mesa-dri xvfb
      - name: Install Rive CLI
        run: |
          curl --fail --silent --show-error --location https://releases.rive.app/cli/install.sh -o /tmp/install-rive.sh
          bash /tmp/install-rive.sh
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Generate and validate
        run: |
          mkdir -p build
          rive --version
          python3 authoring/build_character.py
          rive . --verify --format=json | tee build/verify.json
          rive inspect . --summary | tee build/inspect.json
          python3 -m unittest discover -s tests -v
          python3 authoring/preview_svg.py
      - name: Capture native frame and diagnostics
        run: |
          xvfb-run -a rive . --screenshot=build/native-frame.png --advance=1 --data-dump=build/rest.json
          cp scene.rml build/generated-scene.rml
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Commit explicitly requested generated scene
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[rebuild-scene]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- scene.rml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- scene.rml
            git commit -m 'build: regenerate verified Character Lab scene'
            gh auth setup-git
            git push origin HEAD:main
          fi
      - name: Ensure generated files are synchronized
        run: git diff --exit-code -- scene.rml authoring/neck_data.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-lab-checks
          path: build/
          if-no-files-found: error
